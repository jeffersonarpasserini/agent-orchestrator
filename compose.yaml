services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-orchestrator:0.1.0
    restart: unless-stopped
    env_file:
      - path: ${ORCHESTRATOR_ENV_FILE:-.env}
        required: true
    environment:
      OTEL_SERVICE_NAME: agent-orchestrator
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      HERMES_PROFILES_ROOT: /hermes-state
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - default
      - homelab-data
    depends_on:
      phoenix:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    volumes:
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/barclay/state.db
        target: /hermes-state/barclay/state.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/barclay/state.db-wal
        target: /hermes-state/barclay/state.db-wal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/barclay/state.db-shm
        target: /hermes-state/barclay/state.db-shm
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/obrien/state.db
        target: /hermes-state/obrien/state.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/obrien/state.db-wal
        target: /hermes-state/obrien/state.db-wal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/obrien/state.db-shm
        target: /hermes-state/obrien/state.db-shm
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/rutherford/state.db
        target: /hermes-state/rutherford/state.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/rutherford/state.db-wal
        target: /hermes-state/rutherford/state.db-wal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/rutherford/state.db-shm
        target: /hermes-state/rutherford/state.db-shm
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/tuvok/state.db
        target: /hermes-state/tuvok/state.db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/tuvok/state.db-wal
        target: /hermes-state/tuvok/state.db-wal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_ROOT}/tuvok/state.db-shm
        target: /hermes-state/tuvok/state.db-shm
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  phoenix:
    image: arizephoenix/phoenix:version-19.4.0-nonroot
    restart: unless-stopped
    environment:
      PHOENIX_POSTGRES_HOST: shared-postgres
      PHOENIX_POSTGRES_PORT: "5432"
      PHOENIX_POSTGRES_USER: agent_orchestrator
      PHOENIX_POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD}
      PHOENIX_POSTGRES_DB: agent_orchestrator
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    networks:
      - default
      - homelab-data
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.1@sha256:bbd0832ed3dd7973a726273172f3086c2b88e10f8c24603811af2f34c192d566
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD}
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_HTTP_ADDR: 0.0.0.0
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      ZO_COMPACT_FAST_MODE: "false"
      ZO_TELEMETRY: "false"
      ZO_PROMETHEUS_ENABLED: "true"
      ZO_PRINT_KEY_CONFIG: "false"
      ZO_PRINT_KEY_SQL: "false"
      RUST_LOG: warn
    ports:
      - "127.0.0.1:5080:5080"
    networks:
      - observability-edge
    volumes:
      - openobserve-data:/data
    healthcheck:
      test: ["CMD", "/openobserve", "--version"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OPENOBSERVE_ROOT_EMAIL: ${OPENOBSERVE_ROOT_EMAIL}
      OPENOBSERVE_ROOT_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    networks:
      - default
      - observability-edge
    volumes:
      - type: bind
        source: ./observability/otel-collector.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
    depends_on:
      phoenix:
        condition: service_healthy
      openobserve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

networks:
  observability-edge:
  homelab-data:
    external: true

volumes:
  openobserve-data:
